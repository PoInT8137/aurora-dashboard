<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Знак «Север»: стрелка компаса. Северная лопасть — цвета сияния слева направо, левая грань
       в тени; остриё выходит в разрыв кольца, к Полярной звезде. Южная половина — внутри кольца.
       Построение — сетка 96: кольцо R 34 (толщина 4, разрыв 28°), лопасть 37–59 × 6–48, юг до 78,
       ось R 3, звезда в (78, 12). Мастер-файл иконок (tools/brand.html); та же разметка — в шапке
       сайта (index.html), там цвета из переменных темы. -->
  <defs>
    <linearGradient id="n" gradientUnits="userSpaceOnUse" x1="37" y1="0" x2="59" y2="0">
      <stop offset="0" stop-color="#4DFFB8"/><stop offset=".5" stop-color="#35D6E8"/><stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
  </defs>
  <path d="M56.23 15.01A34 34 0 1 1 39.77 15.01" fill="none" stroke="#8FA0B0" stroke-width="4"/>
  <path d="M37 48H59L48 78Z" fill="#2F3E50"/>
  <path d="M48 6L37 48H59Z" fill="url(#n)"/>
  <path d="M48 6L37 48H48Z" fill="#000" fill-opacity=".2"/>
  <circle cx="48" cy="48" r="3" fill="#0A111C"/>
  <path d="M78 5L79.4 10.6 85 12 79.4 13.4 78 19 76.6 13.4 71 12 76.6 10.6Z" fill="#E9EEF2"/>
</svg>
