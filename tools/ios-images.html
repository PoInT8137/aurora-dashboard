<!DOCTYPE html>
<!-- Шаблон картинок для iPhone: иконка «Домой» (?kind=icon) и стартовый экран (?kind=splash).
     Снимает tools/make-ios-images.mjs через Chrome без окна; размер — из адреса (?w=&h=), чёткость — масштабом. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #060b14; }
  .icon { position: fixed; left: 0; top: 0; width: calc(var(--u) * 100); height: calc(var(--u) * 100); background: url(../icons/icon-512.png) center / cover no-repeat; }

  .splash {
    position: fixed;
    left: 0;
    top: 0;
    width: calc(var(--u) * 100);
    height: var(--h);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(var(--u) * 5);
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(70% 38% at 25% 8%, rgba(77, 255, 184, 0.22), transparent 70%),
      radial-gradient(65% 34% at 78% 4%, rgba(155, 123, 255, 0.22), transparent 70%),
      radial-gradient(50% 30% at 50% 18%, rgba(53, 214, 232, 0.14), transparent 70%),
      #060b14;
  }
  .stars {
    position: fixed;
    inset: 0;
    opacity: 0.7;
    background-image:
      radial-gradient(circle at 12% 18%, #fff 0 0.8px, transparent 1.3px),
      radial-gradient(circle at 67% 9%, rgba(255,255,255,.7) 0 0.6px, transparent 1.1px),
      radial-gradient(circle at 38% 52%, rgba(255,255,255,.8) 0 0.7px, transparent 1.2px),
      radial-gradient(circle at 88% 64%, rgba(255,255,255,.6) 0 0.6px, transparent 1.1px),
      radial-gradient(circle at 22% 83%, rgba(255,255,255,.7) 0 0.7px, transparent 1.2px),
      radial-gradient(circle at 74% 91%, #fff 0 0.9px, transparent 1.4px);
    background-size: 180px 180px;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 55%, transparent 95%);
  }
  .splash__icon {
    position: relative;
    width: calc(var(--u) * 30);
    height: calc(var(--u) * 30);
    border-radius: 22%;
    background: url(../icons/icon-512.png) center / cover no-repeat;
    box-shadow: 0 0 60px rgba(77, 255, 184, 0.25), 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  .splash__name {
    position: relative;
    margin: calc(var(--u) * 2) 0 0;
    font-size: calc(var(--u) * 7.4);
    font-weight: 650;
    letter-spacing: -0.02em;
    background: linear-gradient(100deg, #4dffb8, #35d6e8 45%, #9b7bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .splash__region {
    position: relative;
    margin: calc(var(--u) * -3) 0 0;
    font-size: calc(var(--u) * 3.3);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8ea3b5;
  }
</style>
</head>
<body>
<script>
  // Chrome без окна не бывает уже ~500 px, а снимок берёт левый верхний угол — поэтому
  // размеры не от окна (vw), а из адреса: --u — сотая ширины, --h — высота.
  var q = new URLSearchParams(location.search);
  var kind = q.get('kind') || 'icon';
  document.documentElement.style.setProperty('--u', Number(q.get('w') || 180) / 100 + 'px');
  document.documentElement.style.setProperty('--h', Number(q.get('h') || 180) + 'px');
  document.body.innerHTML = kind === 'icon'
    ? '<div class="icon"></div>'
    : '<div class="splash"><div class="stars"></div><div class="splash__icon"></div>' +
      '<p class="splash__name">Северное сияние</p><p class="splash__region">Мурманская область</p></div>';
</script>
</body>
</html>
